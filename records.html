<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyLog - 学習記録</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="records">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-wrap">
          <div class="brand-mark">S</div>
          <div>
            <p class="eyebrow">学習管理</p>
            <h1>StudyLog</h1>
          </div>
        </div>

        <nav class="nav">
          <a class="nav-item" href="index.html">ダッシュボード</a>
          <a class="nav-item active" href="records.html">学習記録</a>
          <a class="nav-item" href="plans.html">学習計画</a>
          <a class="nav-item" href="calendar.html">カレンダー</a>
        </nav>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Records</p>
            <h2>学習記録</h2>
          </div>
        </header>

        <section class="card panel" id="records">
          <div class="panel-header">
            <h3>学習記録</h3>
          </div>
          <div class="daily-summary">
            <div class="daily-summary-header">
              <span id="selectedDateLabel">全日</span>
            </div>
            <div id="dailyStats" class="daily-stats"></div>
          </div>
          <ul id="studyList" class="list"></ul>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
