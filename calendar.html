<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyLog - 学習カレンダー</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="calendar">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-wrap">
          <div class="brand-mark">S</div>
          <div>
            <p class="eyebrow">学習管理</p>
            <h1>StudyLog</h1>
          </div>
        </div>

        <nav class="nav">
          <a class="nav-item" href="index.html">ダッシュボード</a>
          <a class="nav-item" href="records.html">学習記録</a>
          <a class="nav-item" href="plans.html">学習計画</a>
          <a class="nav-item active" href="calendar.html">カレンダー</a>
        </nav>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Calendar</p>
            <h2>学習カレンダー</h2>
          </div>
        </header>

        <section class="card panel" id="calendarSection">
          <div class="panel-header calendar-header">
            <h3>学習カレンダー</h3>
            <div class="calendar-actions">
              <button type="button" id="prevMonth" class="secondary-btn small-btn">前月</button>
              <input type="month" id="calendarMonthPicker" class="month-picker" aria-label="表示する月" />
              <button type="button" id="nextMonth" class="secondary-btn small-btn">次月</button>
            </div>
          </div>
          <div class="calendar-weekdays">
            <span>日</span>
            <span>月</span>
            <span>火</span>
            <span>水</span>
            <span>木</span>
            <span>金</span>
            <span>土</span>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
