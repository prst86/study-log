<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyLog - 学習計画</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="plans">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-wrap">
          <div class="brand-mark">S</div>
          <div>
            <p class="eyebrow">学習管理</p>
            <h1>StudyLog</h1>
          </div>
        </div>

        <nav class="nav">
          <a class="nav-item" href="index.html">ダッシュボード</a>
          <a class="nav-item" href="records.html">学習記録</a>
          <a class="nav-item active" href="plans.html">学習計画</a>
          <a class="nav-item" href="calendar.html">カレンダー</a>
        </nav>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Plans</p>
            <h2>学習計画</h2>
          </div>
        </header>

        <section class="card panel">
          <div class="panel-header">
            <h3>学習計画を追加</h3>
          </div>
          <form id="planForm" class="stacked-form">
            <label>
              計画タイトル
              <input type="text" id="planTitle" placeholder="例: 英文法の復習" required />
            </label>
            <div class="row two-col">
              <label>
                教科
                <input type="text" id="planSubject" placeholder="例: 英語" required />
              </label>
              <label>
                目標分数
                <input type="number" id="planMinutes" min="15" max="600" value="60" required />
              </label>
            </div>
            <label>
              期日
              <input type="date" id="planDate" required />
            </label>
            <button class="primary-btn" type="submit">計画を追加</button>
          </form>
        </section>

        <section class="card panel" id="plans">
          <div class="panel-header">
            <h3>計画一覧</h3>
          </div>
          <ul id="planList" class="plan-list"></ul>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
